version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prueba-postgres
    environment:
      POSTGRES_DB: prueba_db
      POSTGRES_USER: prueba_user
      POSTGRES_PASSWORD: prueba_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prueba-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prueba_user -d prueba_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: prueba-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/prueba_db
      SPRING_DATASOURCE_USERNAME: prueba_user
      SPRING_DATASOURCE_PASSWORD: prueba_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "8080:8080"
    networks:
      - prueba-network
    volumes:
      - ./logs:/app/logs

networks:
  prueba-network:
    driver: bridge

volumes:
  postgres_data: