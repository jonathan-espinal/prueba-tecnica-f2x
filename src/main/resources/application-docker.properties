# Configuración para Docker con PostgreSQL
spring.application.name=prueba

# Conexión a PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prueba_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:prueba_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:prueba_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de conexión pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# Nivel de log global
logging.level.root=INFO

# Guardar logs en archivo
logging.file.name=logs/app.log

# Rotación de archivos (opcional)
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7