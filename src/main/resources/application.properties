spring.application.name=prueba

# Conexión a SQLite (Crea el archivo usuarios.db en la raíz)
spring.datasource.url=jdbc:sqlite:prueba.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Dialecto para que Hibernate entienda SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# "EnsureCreated" equivalente: crea/actualiza tablas al iniciar
spring.jpa.hibernate.ddl-auto=update

# Ver el SQL en consola (útil para debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Deshabilitar la validación de datasource (SQLite no necesita autenticación)
spring.datasource.validation-query=SELECT 1

# Configuración específica para SQLite
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

